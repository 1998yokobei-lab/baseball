<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaseStory - AI自動生成モード</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.js"></script>
    <style>
        body { background-color: #121214; color: #FFFFFF; font-family: sans-serif; margin: 0; padding: 0; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 480px; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        header { margin-bottom: 24px; }
        h1 { font-size: 24px; margin: 0 0 4px 0; }
        .subtitle { font-size: 14px; color: #8E8E93; margin: 0; }
        
        /* AIボタンのスタイル（オレンジ色で目立たせる） */
        .ai-btn-container { background-color: #1E1E22; padding: 12px; border-radius: 12px; margin-bottom: 20px; border: 1px dashed #E67E22; }
        .ai-button { display: block; width: 100%; background-color: #E67E22; color: #FFFFFF; border: none; border-radius: 8px; padding: 12px 0; font-weight: bold; text-align: center; cursor: pointer; font-size: 14px; }
        .ai-button:disabled { background-color: #7F8C8D; cursor: not-allowed; }
        
        .card { background-color: #1E1E22; border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); }
        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .game-title { font-size: 18px; margin: 0; }
        .stadium-text { font-size: 12px; color: #A2A2A6; }
        .divider { height: 1px; background-color: #2C2C2E; margin-bottom: 12px; }
        .section { margin-bottom: 16px; }
        .section-label { font-size: 12px; font-weight: bold; color: #3498DB; margin-bottom: 6px; }
        .body-text { font-size: 14px; color: #E5E5EA; line-height: 1.6; margin: 0; }
        .player-section { background-color: #26262B; padding: 12px; border-radius: 8px; }
        .player-name { font-size: 16px; color: #FFCC00; margin: 0 0 4px 0; }
        .player-description { font-size: 13px; color: #E5E5EA; line-height: 1.5; margin: 0; }
        .loading { text-align: center; color: #8E8E93; margin-top: 40px; }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>今日の観戦ブリーフィング</h1>
            <p class="subtitle">AI自動翻訳×Supabaseリアルタイム連動中</p>
        </header>

        <div class="ai-btn-container">
            <button id="ai-trigger" class="ai-button" onclick="runAI()">🤖 AIで最新データをストーリーに翻訳する</button>
        </div>

        <main id="game-list">
            <div class="loading">データを読み込み中...</div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://zthdzfqsuztfsxjoboms.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_DUhETmOXmNsqT_MKoiqYsQ_XbGX_ioG';
        
        // ⚠️ ここにさっきゲットした「sk-proj-...」から始まるOpenAIのキーを貼り付けて！
        const OPENAI_API_KEY = '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'; 

        // Supabaseの初期化
        const { createClient } = window.supabase;
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 1. 画面にSupabaseのデータを表示する処理
        async function fetchGamesFromSupabase() {
            const container = document.getElementById('game-list');
            try {
                const { data: games, error } = await supabase.from('games').select('*');
                if (error) throw error;
                if (!games || games.length === 0) {
                    container.innerHTML = '<div class="loading">試合データが空っぽです。</div>';
                    return;
                }
                container.innerHTML = '';
                games.forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="game-header">
                            <h2 class="game-title">${game.away_team} vs ${game.home_team}</h2>
                            <span class="stadium-text">${game.stadium}</span>
                        </div>
                        <div class="divider"></div>
                        <div class="section">
                            <div class="section-label">💡 今日の見どころ</div>
                            <p class="body-text">${game.ai_story || 'まだ生成されていません'}</p>
                        </div>
                        <div class="section player-section">
                            <div class="section-label">🔥 本日の注目選手</div>
                            <h3 class="player-name">${game.featured_player || '未定'}</h3>
                            <p class="player-description">${game.player_reason || '解説待ち'}</p>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error(err);
                container.innerHTML = '<div class="loading">接続エラーが発生しました。</div>';
            }
        }

        // 2. ボタンを押したときにAIを呼び出してSupabaseを書き換える処理
        async function runAI() {
            const btn = document.getElementById('ai-trigger');
            btn.disabled = true;
            btn.innerText = '⏳ AIがデータを分析して執筆中...';

            // 本来は毎日自動で変わる「生の成績数字データ」のパーツ
            const playerData = {
                name: '牧 秀悟',
                season_avg: '.295',
                last_5_avg: '.412',
                last_10_ops: '1.050',
                extra_info: '直近3試合で2本塁打、相手先発の左投手に対して今季打率.385'
            };

            const prompt = `
以下の【野球選手データ】を読み解き、野球初心者でも凄さが一瞬でわかる解説を作ってください。
【野球選手データ】
・選手名: ${playerData.name}
・今季打率: ${playerData.season_avg}
・直近5試合打率: ${playerData.last_5_avg}
・直近10試合の貢献度指標(OPS): ${playerData.last_10_ops}
・補足情報: ${playerData.extra_info}

【絶対ルール】
1. 専門用語（OPSなど）は使わないか、中学生でも一瞬でわかる言葉に言い換えて。
2. フランクで親しみやすいプロ野球解説者のトーンで書いて。
3. 必ず以下のJSONフォーマットだけで返答して。

{"ai_story": "試合の見どころ100文字程度", "player_reason": "注目理由100文字程度"}
`;

            try {
                // OpenAIのAPIを直接叩く
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${OPENAI_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-4o-mini',
                        messages: [{ role: 'user', content: prompt }],
                        response_format: { type: "json_object" }
                    })
                });

                const resData = await response.json();
                const aiResult = JSON.parse(resData.choices[0].message.content);

                // 生成されたAIの文章でSupabaseをアップデート
                const { error } = await supabase
                    .from('games')
                    .update({
                        ai_story: aiResult.ai_story,
                        featured_player: playerData.name,
                        player_reason: aiResult.player_reason
                    })
                    .eq('id', 1);

                if (error) throw error;

                alert('✅ AI解説が完成し、Supabaseの書き換えに成功したぜ！');
                // 画面を再読み込みして最新のAI文章を表示
                fetchGamesFromSupabase();

            } catch (err) {
                console.error(err);
                alert('エラーが起きたぜ。OpenAIのキーが合っているか確認してね。');
            } finally {
                btn.disabled = false;
                btn.innerText = '🤖 AIで最新データをストーリーに翻訳する';
            }
        }

        document.addEventListener('DOMContentLoaded', fetchGamesFromSupabase);
    </script>
</body>
</html>
